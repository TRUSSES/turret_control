  servo_dir_pin: 20
  servo_enc_a: 16
  servo_enc_b: 19
  zipper_enc_cs_pin: 2
  zipper_enc_clk_pin: 4
  zipper_enc_do_pin: 3
  limit_switch_pin: 15
  extension_per_step: 0.000004453125
  debounce_threshold_ms: 30

turret_encoder:
  cs_pin: 12
  clk_pin: 6
  do_pin: 13
  encoder_max_value: 1023
  offset: 0


