spiral_zipper:
  servo_pwm_pin: 21
  servo_dir_pin: 20
  servo_enc_a: 16
  servo_enc_b: 19
  zipper_enc_cs_pin: 2
  zipper_enc_clk_pin: 4
  zipper_enc_do_pin: 3
  limit_switch_pin: 15
  extension_per_step: 0.000004453125
  debounce_threshold_ms: 30

turret_encoder:
  cs_pin: 12
  clk_pin: 6
  do_pin: 13
  encoder_max_value: 1023
  offset: 0


turret_limit_switch:
  limit_switch_pin: 14
  debounce_threshold_ms: 30
  active_low: true

pitch_motor:
  motor_id: 10

yaw_motor:
  motor_id: 11


x_offset: 0.14
# y_offset is expressed as (y - h) 
y_offset: -0.185
pitch_kinematics_sign: -1.0
pitch_angle_offset_deg: 0.0

turret_id: 1

docking:
  # This dock ID is independent of turret_id.
  target_dock_id: 1
  target_tag_frame: tag36h11_0
  camera_frame: camera_link
  goal_camera_x_m: 0.0
  goal_camera_y_m: 0.03
  insertion_distance_m: 0.10
  lateral_tolerance_m: 0.015
  vertical_tolerance_m: 0.02
  lateral_deadband_m: 0.005
  vertical_deadband_m: 0.005
  depth_deadband_m: 0.005
  pose_timeout_sec: 0.5
  state_timeout_sec: 0.5
  command_period_sec: 0.1
  max_dt_sec: 0.1
  camera_forward_sign: 1.0
  camera_vertical_sign: 1.0
  # Positive measured pitch moves down from the homed position.
  pitch_down_sign: 1.0
  pitch_min_deg: 0.0
  pitch_max_deg: 63.0
  # Set yaw_correction_sign after checking motor direction against camera x.
  yaw_correction_sign: 1.0
  yaw_limit_from_start_deg: 30.0
  pitch_gain_rad_per_m: 10.0
  yaw_gain: 1.5
  extension_gain: 0.8
  max_pitch_rate_deg_s: 20.0
  max_yaw_rate_deg_s: 15.0
  max_extension_rate_m_s: 0.04
  max_pitch_step_deg: 2.0
  max_yaw_step_deg: 2.0
  max_extension_step_m: 0.01
  # These extension bounds apply to vision approach/recovery, not insertion.
  extension_min_m: 0.0
  extension_max_m: 0.90
  zipper_motor_velocity_rad_s: 1.5
  initial_search_extension_m: -1.0  # Hold the extension measured when DOCK starts.
  search_pitch_span_deg: 63.0
  search_pitch_rate_deg_s: 8.0
  search_timeout_sec: 20.0
  alignment_timeout_sec: 20.0
  approach_timeout_sec: 40.0
  recovery_retract_m: 0.03
  recovery_retract_velocity_rad_s: 0.5
  recovery_extension_tolerance_m: 0.003
  recovery_pitch_span_deg: 10.0
  recovery_pitch_endpoint_tolerance_deg: 1.0
  recovery_pitch_rate_deg_s: 8.0
  recovery_retract_timeout_sec: 8.0
  recovery_sweep_timeout_sec: 15.0
  max_recovery_attempts: 2
  # Insertion runs at fixed motor velocity until contact, with NO travel/time cutoff.
  # Zipper speeds below are motor rad/s, not extension m/s.
  insertion_velocity_rad_s: 0.3
  final_insertion_pitch_motor_velocity_rad_s: 0.4
  latch_timeout_sec: 8.0

undocking:
  pitch_only_duration_sec: 5.0
  combined_retract_duration_sec: 3.0
  target_extension_m: 0.2
  target_pitch_deg: 40.0
  retract_velocity: 1.8
