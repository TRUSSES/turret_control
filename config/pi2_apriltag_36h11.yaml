apriltag:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.056
    profile: false
    max_hamming: 0
    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
      refine: 1
      sharpening: 0.25
      debug: 0
    pose_estimation_method: pnp
    tag:
      # Match the active apriltag_docking config: VIO tags are not dock targets.
      ids: [25]
      frames: [tag36h11_25]
      sizes: [0.056]
